<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh_CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>出错了 - File Server</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --primary: #4f6ef7;
      --text-main: #2d3748;
      --text-muted: #8492a6;
      --danger: #e5534b;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(45, 62, 80, .08);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fdecea;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
    }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 12px; }
    .msg {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
      word-break: break-all;
      background: #fafbfc;
      border: 1px solid #e8ecf1;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 0 0 26px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 9px;
      text-decoration: none;
      transition: all .18s;
      box-shadow: 0 3px 10px rgba(79, 110, 247, .3);
    }
    .btn-home:hover { background: #3b5de7; transform: translateY(-1px); }
  </style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e5534b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <h1>请求出现错误</h1>
  <div class="msg" th:text="${message}">未知错误</div>
  <a th:href="@{/files}" class="btn-home">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    返回文件列表
  </a>
</div>
</body>
</html>
