services:
  backend:
    build:
      context: ..
      dockerfile: file-server/deploy/Dockerfile.backend
    container_name: file-server-backend
    environment:
      - SERVER_PORT=8080
      - FILE_SERVER_WORKSPACE=/data
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
    networks:
      - file-server-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file-server-frontend
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - file-server-net

networks:
  file-server-net:
    driver: bridge
